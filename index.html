<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bible Atlas — an interactive 3D encyclopedia of biblical structures described in the King James Bible." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Link preview card.
         NOTE: og:image and og:url must be ABSOLUTE urls. Most crawlers resolve
         a relative path against the page, but not all — swap in the real
         origin (e.g. https://bible-atlas.example.com/og-cover.jpg) once the
         site has a domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bible Atlas" />
    <meta property="og:title" content="Bible Atlas" />
    <meta
      property="og:description"
      content="Explore the structures of the Bible. Biblical buildings in interactive 3D — study each structure, read the Scripture, and understand how God's people worshipped."
    />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An illustrated cutaway of Solomon's Temple with its inner courts, set on aged parchment with architectural sketches, beside the words Bible Atlas." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bible Atlas" />
    <meta
      name="twitter:description"
      content="Explore the structures of the Bible. Biblical buildings in interactive 3D — study each structure, read the Scripture, and understand how God's people worshipped."
    />
    <meta name="twitter:image" content="/og-cover.jpg" />
    <meta name="twitter:image:alt" content="An illustrated cutaway of Solomon's Temple with its inner courts, set on aged parchment with architectural sketches, beside the words Bible Atlas." />

    <meta name="theme-color" content="#3C5E70" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Bible Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
